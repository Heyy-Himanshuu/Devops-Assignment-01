# The scenario's client expects a database Service that the course never creates.
# This stand-in is a tiny TCP listener on 5432 (busybox nc) behind a Service named
# postgres-db, so the fixed client has something real to resolve and connect to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: tcp-5432
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo 'postgres stand-in' | nc -l -p 5432; done"]
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
