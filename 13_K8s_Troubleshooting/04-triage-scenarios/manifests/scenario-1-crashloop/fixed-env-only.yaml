# Attempt 1: supply the missing DATABASE_URL. The FATAL error goes away...
# ...but the script then prints "started successfully" and EXITS (code 0).
# A Pod's default restartPolicy is Always, so a clean exit is restarted too.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: postgresql://app@postgres.s14-triage.svc.cluster.local:5432/app
      command:
        - "python3"
        - "-c"
        - |
          import os, sys
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
