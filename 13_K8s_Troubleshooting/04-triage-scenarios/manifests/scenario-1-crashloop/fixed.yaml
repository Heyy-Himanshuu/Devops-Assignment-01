# Final fix: DATABASE_URL supplied AND the process stays in the foreground like a
# real server would. (If this were a one-shot task, the right object would be a
# Job, not a bare Pod with restartPolicy Always.)
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: postgresql://app@postgres.s14-triage.svc.cluster.local:5432/app
      command:
        - "python3"
        - "-u"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
          while True:
              time.sleep(30)
