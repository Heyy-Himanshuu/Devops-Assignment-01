# Written for this lab (the course has no ContainerCreating example).
# The Pod mounts a ConfigMap that was never created, so the kubelet cannot
# build the volume and the container is never started.
apiVersion: v1
kind: Pod
metadata:
  name: creating-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
  volumes:
    - name: site
      configMap:
        name: site-content
