# Fixed: the configMapKeyRef key now matches the ConfigMap key exactly (keys are case-sensitive).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  db_host: postgres.s14-issues.svc.cluster.local
  log_level: debug
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo DB_HOST=$DB_HOST LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: db_host
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: log_level
