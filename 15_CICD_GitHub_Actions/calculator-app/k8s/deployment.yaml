apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      imagePullSecrets:
        - name: ghcr-pull          # created by the CD job from GITHUB_TOKEN
      containers:
        - name: calculator
          image: __IMAGE__         # replaced by the CD job with ghcr.io/...:<sha>
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 3
