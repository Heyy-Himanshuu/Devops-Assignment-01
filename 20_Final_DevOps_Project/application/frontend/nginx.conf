# Runs as the unprivileged nginx user, so it listens on 8080 (ports < 1024 need root).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # API calls are proxied to the backend Service. BACKEND_URL is substituted at container start
  # by the nginx image's envsubst template step, so the same image works in Compose
  # (http://backend:8000) and Kubernetes (http://<release>-backend:8000).
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
