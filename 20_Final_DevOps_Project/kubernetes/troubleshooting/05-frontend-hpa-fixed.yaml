# Issue 5 (fixed): scaleTargetRef now names the real Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spendboard-frontend
  namespace: s21-spendboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spendboard-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
