{{- if .Values.ingress.enabled }}
{{- $fullname := include "spendboard.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels: {{- include "spendboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ $fullname }}-backend, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $fullname }}-frontend, port: { name: http } } }
{{- end }}
