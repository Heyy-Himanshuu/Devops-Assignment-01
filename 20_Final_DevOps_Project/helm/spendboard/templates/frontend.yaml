{{- $fullname := include "spendboard.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels: {{- include "spendboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{- include "spendboard.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "spendboard.selector" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.image.frontend (include "spendboard.tag" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # nginx.conf proxies /api/ here (rendered by envsubst when the container starts)
            - { name: BACKEND_URL, value: "http://{{ $fullname }}-backend:8000" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- include "spendboard.podSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-frontend
  labels: {{- include "spendboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector: {{- include "spendboard.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
