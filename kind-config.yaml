kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-hw
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - {containerPort: 80,    hostPort: 8080,  protocol: TCP}
  - {containerPort: 30010, hostPort: 30010, protocol: TCP}
  - {containerPort: 30020, hostPort: 30020, protocol: TCP}
  - {containerPort: 30030, hostPort: 30030, protocol: TCP}
  - {containerPort: 30040, hostPort: 30040, protocol: TCP}
  - {containerPort: 30080, hostPort: 30080, protocol: TCP}
- role: worker
- role: worker
