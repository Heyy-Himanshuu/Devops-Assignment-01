# Same 30s boot, same liveness probe - plus the startup probe from startup.yaml.
# The startup probe allows up to 30 x 2s = 60s to boot and holds the liveness
# probe back until it succeeds, so the container is never killed.
apiVersion: v1
kind: Pod
metadata:
  name: slow-with-startup
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "sleep 30; exec nginx -g 'daemon off;'"]
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 3
