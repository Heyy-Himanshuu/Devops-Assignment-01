# Fixed version of student-pvc.yaml.
# storageClassName: "" opts OUT of the default StorageClass, so the claim can only
# bind to a pre-created PV that also has no class - i.e. student-pv.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-pvc
spec:
  storageClassName: ""
  volumeName: student-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
