# Extra load: 4 more copies of the course's wget loop.
# One busybox loop is itself CPU-bound (~0.8 core) and only pushes ~90m of CPU
# into nginx, which plateaus the HPA at 2 replicas. Four more push it to max.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-burst
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-burst
  template:
    metadata:
      labels:
        app: load-burst
    spec:
      containers:
        - name: wget-loop
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service >/dev/null; done"]
